name: Build Docker & Deploy to Render

on:
  push:
    branches: [ main ]       # Triggers on every push to main
  pull_request:
    branches: [ main ]       # Also runs checks on PRs (but won't deploy)

jobs:
  # ─── Job 1: Build Docker Image to verify it compiles ───
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: docker build -t interview-drive-manager ./backend
        # This confirms your Dockerfile and code are valid
        # If this fails, deployment is blocked 

  # ─── Job 2: Deploy to Render (only on push to main) ───
  deploy:
    needs: build              # Only runs if 'build' job passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deployment
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Render deployment triggered successfully"